<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>浏览器搭子</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- 液态玻璃背景光斑 -->
    <div class="bg-orbs" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="orb orb-c"></span>
    </div>

    <!-- 顶部导航栏 -->
    <header class="topbar glass">
      <div class="brand">
        <img class="brand-icon" src="icons/icon32.png" alt="logo" width="22" height="22" />
        <div class="brand-text">
          <span class="brand-title">浏览器搭子</span>
          <span class="brand-sub" id="brandSub">Chromium 浏览器</span>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="home">概览</button>
        <button class="nav-item" data-view="history">历史</button>
        <button class="nav-item" data-view="tabs">标签</button>
        <button class="nav-item" data-view="bookmarks">书签</button>
        <button class="nav-item" data-view="downloads">下载</button>
        <button class="nav-item" data-view="cleanup">清理</button>
        <button class="nav-item" data-view="more">更多 ▾</button>
      </nav>
      <!-- 更多面板：收纳次要功能，单屏展开全部入口 -->
      <div class="more-panel glass" id="morePanel" hidden></div>
    </header>

    <main class="content" id="content"></main>

    <!-- 二次确认 / 输入弹窗 -->
    <div class="modal-mask" id="modalMask" hidden>
      <div class="modal glass">
        <h3 id="modalTitle"></h3>
        <p id="modalBody"></p>
        <input id="modalInput" class="input" style="display:none;margin-bottom:12px;" autocomplete="off" />
        <div class="modal-actions">
          <button class="btn" id="modalCancel">取消</button>
          <button class="btn btn-danger" id="modalOk">确认</button>
        </div>
      </div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>

    <!-- 核心：命名空间、工具、导航、概览 -->
    <script src="popup.js"></script>
    <!-- 功能模块（经典脚本，按依赖顺序加载） -->
    <script src="modules/history.js"></script>
    <script src="modules/tabs.js"></script>
    <script src="modules/bookmarks.js"></script>
    <script src="modules/downloads.js"></script>
    <script src="modules/cleanup.js"></script>
    <script src="modules/sessions.js"></script>
    <script src="modules/stats.js"></script>
    <script src="modules/fatigue.js"></script>
    <script src="modules/perf.js"></script>
    <script src="modules/audio.js"></script>
    <script src="modules/privacy.js"></script>
    <script src="modules/health.js"></script>
    <script src="modules/focus.js"></script>
    <script src="modules/adblock.js"></script>
    <script src="modules/tamper.js"></script>
    <script src="modules/realestate.js"></script>
    <script src="modules/settings.js"></script>
  </body>
</html>
