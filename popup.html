<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>历史记录清理</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <!-- 不兼容提示（默认隐藏，仅非 Chromium / 无 history 权限时显示） -->
      <div id="incompatible" class="incompatible hidden">
        <h2>当前浏览器不支持</h2>
        <p>
          本插件需要基于 <code>Chromium</code> 内核的浏览器，并授予
          <code>history</code> 权限。
        </p>
        <p>请使用 Chrome / Edge / Brave / Arc / Opera 等浏览器打开。</p>
      </div>

      <!-- 主界面 -->
      <div id="main" class="hidden">
        <header class="header">
          <div class="brand-row">
            <span class="brand-dot"></span>
            <h1>历史记录清理</h1>
            <span id="brand-pill" class="brand-pill">检测中…</span>
          </div>
          <p class="subtitle">按时间段查询、预览、安全删除浏览器历史</p>
        </header>

        <div class="warn-banner">⚠️ 删除操作不可逆，建议先「导出备份」</div>

        <!-- 日期范围 -->
        <section class="section">
          <div class="preset-group" id="preset-group">
            <button class="preset-btn" data-preset="today">今天</button>
            <button class="preset-btn" data-preset="7d">最近 7 天</button>
            <button class="preset-btn" data-preset="30d">最近 30 天</button>
            <button class="preset-btn" data-preset="custom">自定义</button>
          </div>
          <div class="date-range">
            <label>起始日期<input type="date" id="start-date" /></label>
            <label>结束日期<input type="date" id="end-date" /></label>
            <button id="search-btn" class="primary-btn">查询</button>
          </div>
        </section>

        <!-- 实时过滤 -->
        <section class="section filter-row">
          <input
            type="search"
            id="filter-input"
            placeholder="🔍 按标题或 URL 实时过滤…"
          />
        </section>

        <!-- 列表 -->
        <section class="section list-section">
          <div class="toolbar">
            <label class="select-all">
              <input type="checkbox" id="select-all" /> 全选
            </label>
            <span class="count-label" id="count-label">共 0 条</span>
            <div class="export-group">
              <button class="ghost-btn" id="export-json">导出 JSON</button>
              <button class="ghost-btn" id="export-csv">导出 CSV</button>
            </div>
          </div>
          <div id="loading" class="loading hidden">查询中…</div>
          <div id="list" class="list"></div>
        </section>

        <!-- 操作 -->
        <footer class="footer">
          <button id="delete-selected" class="danger-btn" disabled>
            删除选中
          </button>
          <button id="delete-all" class="danger-btn">删除全部</button>
        </footer>
      </div>

      <!-- 二次确认弹窗 -->
      <div id="overlay" class="overlay hidden">
        <div class="confirm-dialog">
          <h3>确认删除？</h3>
          <p id="confirm-text">此操作不可逆。</p>
          <div class="confirm-actions">
            <button id="confirm-cancel" class="ghost-btn">取消</button>
            <button id="confirm-ok" class="danger-btn" style="flex: 0 0 auto">
              确认删除
            </button>
          </div>
        </div>
      </div>

      <div id="toast" class="toast hidden"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
