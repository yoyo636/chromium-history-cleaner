app = "browser-companion-site"

[build]
  dockerfile = "Dockerfile"

[env]
  # server.py 读取 PORT 环境变量；Fly.io 会把它设为 internal_port
  PORT = "8765"

[[services]]
  protocol = "http"
  internal_port = 8765

  # 健康检查：确保服务真的起来
  [[services.http_checks]]
    interval = 10000
    timeout = 2000
    http_method = "get"
    path = "/api/version"
    expected_status = 200